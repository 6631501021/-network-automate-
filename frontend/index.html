<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GNS3 Router Controller</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 50px auto;
        }

        .card {
            background: #1f2937;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #4b5563;
            border-radius: 6px;
            background: #111827;
            color: white;
            font-size: 16px;
        }

        textarea {
            min-height: 120px;
            font-family: monospace;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            background: #4b5563;
            cursor: not-allowed;
        }

        #output {
            margin-top: 10px;
            min-height: 250px;
            padding: 15px;
            background: black;
            color: #22c55e;
            border-radius: 6px;
            white-space: pre-wrap;
            overflow: auto;
            font-family: monospace;
        }

        #status {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>GNS3 Router Controller</h1>

        <label>
            Router IP
        </label>

        <input
            id="routerIp"
            type="text"
            value="192.168.126.130"
            placeholder="192.168.126.130"
        >

        <label>
            Router Command
        </label>

        <textarea
            id="command"
            placeholder="show ip interface brief"
        >show ip interface brief</textarea>

        <button
            id="executeButton"
            onclick="executeCommand()"
        >
            Execute
        </button>

        <div id="status"></div>

        <h3>Output</h3>

        <pre id="output">Waiting for command...</pre>

    </div>

</div>


<script>

async function executeCommand() {

    const ip =
        document
        .getElementById("routerIp")
        .value
        .trim();

    const command =
        document
        .getElementById("command")
        .value
        .trim();

    const output =
        document.getElementById("output");

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("executeButton");


    if (!ip) {
        alert("Enter router IP");
        return;
    }

    if (!command) {
        alert("Enter router command");
        return;
    }


    button.disabled = true;

    button.innerText =
        "Executing...";

    status.innerText =
        "Connecting to " + ip;

    output.textContent =
        "Please wait...";


    try {

        const response =
            await fetch(
                "/api/execute",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                        "application/json"
                    },

                    body: JSON.stringify({
                        ip: ip,
                        command: command
                    })
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Unknown error"
            );

        }


        output.textContent =
            data.output ||
            "Command completed";

        status.innerText =
            "Completed";

    }

    catch (error) {

        output.textContent =
            "ERROR:\n" +
            error.message;

        status.innerText =
            "Failed";

    }

    finally {

        button.disabled = false;

        button.innerText =
            "Execute";

    }
}

</script>

</body>

</html>
